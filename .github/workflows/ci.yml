name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Go 检查（core）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./core/

      - name: go test -race
        run: go test -race ./core/ -count=1

  windows:
    name: Windows 构建与前端测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum

      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 前端单元测试
        working-directory: frontend
        run: pnpm test

      - name: 构建前端资源
        working-directory: frontend
        run: pnpm run build

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: go build
        env:
          CGO_ENABLED: '0'
        run: go build -tags desktop,production -trimpath -ldflags "-s -w -H windowsgui" -o LitePad.exe .
