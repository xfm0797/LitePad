name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows amd64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets for go:embed
        working-directory: frontend
        run: pnpm run build

      - name: Run Go tests
        run: go test ./...

      - name: Extract version from wails.json
        id: version
        shell: pwsh
        run: |
          $wails = Get-Content wails.json -Raw | ConvertFrom-Json
          $v = $wails.info.productVersion
          Write-Host "version from wails.json: $v"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Generate Windows resources (icon + manifest + version)
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $json = @"
          {
            "Version": {
              "CompanyName": "LitePad",
              "ProductName": "LitePad",
              "FileVersion": "$v",
              "ProductVersion": "$v",
              "OriginalFilename": "LitePad.exe",
              "InternalName": "LitePad"
            },
            "Icons": ["build/app.ico"]
          }
          "@
          Set-Content -Path build/version.json -Value $json
          Write-Host "build/version.json written for version $v"

      - name: Build Windows exe with embedded version info
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go run github.com/tc-hib/winres@latest --manifest build/app.manifest --icon build/app.ico --res build/version.json -o rsrc_windows_amd64.syso
          go build -tags desktop,production -trimpath -ldflags "-s -w -H windowsgui" -o LitePad.exe .

      - name: Build Inno Setup installer
        uses: ilammy/setup-iss@v1
        with:
          script: release/LitePad.iss

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LitePad ${{ github.ref_name }}
          generate_notes: true
          files: |
            LitePad.exe
            release/LitePad-Setup-*.exe
